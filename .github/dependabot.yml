# Dependency updates for Sandra.
#
# Nothing was watching dependencies before this, so security patches arrived
# only if somebody happened to look. Dependabot's real failure mode on a small
# team is PR noise, so everything below is grouped and weekly: minor and patch
# bumps arrive as ONE pull request per ecosystem, while majors come separately
# because they are the ones that actually need reading.
#
# Security advisories are raised by Dependabot regardless of this schedule and
# ignore the open-PR limits, so a critical CVE is never held back by grouping.
version: 2
updates:
  # ── The Next.js app ────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      routine:
        applies-to: version-updates
        update-types: [minor, patch]
      # Framework bumps land together or not at all — next, react and the
      # types move in lockstep and a partial upgrade just fails the build.
      next-and-react:
        applies-to: version-updates
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom", "eslint-config-next"]
        update-types: [major]

  # ── The voice bridge (separate lockfile, deployed to its own VM) ──────────
  - package-ecosystem: npm
    directory: /voice-bridge
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      routine:
        applies-to: version-updates
        update-types: [minor, patch]

  # ── CI actions ────────────────────────────────────────────────────────────
  # A pinned action that drifts is a supply-chain risk, not a convenience.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
